[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rapid-spike-sorting"
version = "0.1.0"
description = "Reproducible fixed-point replay of a channel-based Intan RHD spike-sorting workflow"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Manuscript authors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "numpy==2.0.2",
  "numba==0.60.0",
  "scikit-learn==1.6.1",
  "spikeinterface==0.103.2",
  "neo==0.14.3",
]

[project.scripts]
rapid = "rapid.cli:main"

[tool.setuptools]
packages = ["rapid"]
