[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-signal-prediction"
version = "0.1.0"
description = "Prediction-only neural signal decoder release"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "scikit-learn>=1.3",
  "torch>=2.1",
]

[project.scripts]
neural-signal-predict = "neural_signal_decoder.predict_nomad:main"

[tool.setuptools.packages.find]
where = ["src"]
